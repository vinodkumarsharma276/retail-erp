name: CI/CD

# check: every push/PR. deploy: push to main (or a manual run) once the
# repository variable DEPLOY_ENABLED is "true"; until then main is only checked.
# Setup, secrets and rollback: docs/features/deployment-and-release.md.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA (or branch) to deploy; empty = head of the selected branch. Older SHAs roll back.'
        required: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: retailerp
          POSTGRES_PASSWORD: retailerp
          POSTGRES_DB: retailerp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://retailerp:retailerp@localhost:5432/retailerp
      TEST_DATABASE_URL: postgresql://retailerp:retailerp@localhost:5432/retailerp_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Typecheck
        run: npx turbo typecheck
      - name: API tests (unit + integration)
        run: npm test
      - name: Build
        run: npx turbo build --filter=@retailerp/api --filter=@retailerp/web

  api-image:
    needs: check
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    # Native runner for the server's CPU (Oracle Ampere = arm64).
    runs-on: ${{ vars.API_PLATFORM == 'linux/amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: ${{ vars.API_PLATFORM || 'linux/arm64' }}
          push: true
          build-args: GIT_SHA=${{ steps.sha.outputs.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/retailerp-api:${{ steps.sha.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-api:
    needs: api-image
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.API_DOMAIN }}/api/ready
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy on the server (backup, migrate, swap, health check, auto-rollback)
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o BatchMode=yes "${{ vars.VM_USER }}@${{ vars.VM_HOST }}" "deploy ${{ needs.api-image.outputs.sha }}"
      - name: Smoke test
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "https://${{ vars.API_DOMAIN }}/api/ready"

  deploy-web:
    # After the API, so the site never calls an API older than itself.
    needs: [api-image, deploy-api]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.WEB_DOMAIN }}
    concurrency:
      group: deploy-web-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.api-image.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build web
        run: npx turbo build --filter=@retailerp/web
        env:
          VITE_API_URL: https://${{ vars.API_DOMAIN }}
          VITE_TENANT_APEX_DOMAINS: ${{ vars.TENANT_APEX_DOMAINS || 'retailerpai.com' }}
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main --commit-hash=${{ needs.api-image.outputs.sha }}