name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: retailerp
          POSTGRES_PASSWORD: retailerp
          POSTGRES_DB: retailerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate --workspace=apps/api
        env:
          DATABASE_URL: postgresql://retailerp:retailerp@localhost:5432/retailerp_test

      - name: Typecheck
        run: npx turbo typecheck

      - name: Build
        run: npx turbo build
